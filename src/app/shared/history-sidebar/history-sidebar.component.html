<div class="flex h-screen w-[320px] flex-col border-r border-slate-200 bg-white/80 backdrop-blur-xl dark:border-white/10 dark:bg-black/40">
  <div class="border-b border-slate-200 px-5 py-5 dark:border-white/10">
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">History</h2>
  </div>

<div class="istory-scroll flex-1 space-y-3 overflow-y-auto p-3">
 <button
      *ngFor="let item of historyList"
      (click)="openHistory(item)"
      class="w-full rounded-2xl border border-transparent bg-slate-100 p-4 text-left transition-all duration-300 hover:border-cyan-500/20 hover:bg-slate-200 dark:bg-white/5 dark:hover:bg-white/10">
      <p class="truncate text-sm font-bold text-slate-900 dark:text-white">
        {{ item.fileName }}
      </p>
      <p class="mt-2 line-clamp-2 text-xs leading-5 text-slate-600 dark:text-slate-400">
        {{ item.englishText }}
      </p>
    </button>
  </div>
</div>
