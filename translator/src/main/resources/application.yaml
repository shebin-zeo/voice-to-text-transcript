spring:
  application:
    name: translator

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true



gemini:
  api:
    key: ${API_KEY}
    url: ${API_URL}

server:
  port:8080
  
  


